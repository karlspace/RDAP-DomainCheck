# =============================================================================
# Dependabot Configuration
# =============================================================================
# The shipped application has zero runtime dependencies — every entry below is
# build, test or CI tooling. Grouping keeps that to one reviewable PR per
# ecosystem per week instead of a dozen isolated bumps.
# =============================================================================

version: 2
updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '18:55'
      timezone: 'Etc/UTC'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'dependabot'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      github-actions:
        patterns:
          - '*'

  # ---------------------------------------------------------------------------
  # npm (build + test tooling)
  # ---------------------------------------------------------------------------
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'sunday'
      time: '18:55'
      timezone: 'Etc/UTC'
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps)'
    # One PR per run for all minor and patch updates, which
    # dependabot-maintenance.yml merges once pr.yml has passed. A grouped
    # PR counts as its strictest update and the gate treats a 0.x minor as
    # major, so a 0.x dependency would hold the whole group open - none is
    # 0.x today; add exclude-patterns here if one is added. Majors fall
    # through to the named groups below and stay open for review.
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      build-tooling:
        patterns:
          - 'vite'
        update-types:
          - 'major'
      test-tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'happy-dom'
        update-types:
          - 'major'
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript'
          - 'typescript-eslint'
          - 'globals'
          - 'prettier*'
        update-types:
          - 'major'
    ignore:
      # typescript-eslint (latest 8.74.0) peers typescript >=4.8.4 <6.1.0, so
      # TypeScript 7 fails `npm ci` with ERESOLVE. Remove once it supports 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
