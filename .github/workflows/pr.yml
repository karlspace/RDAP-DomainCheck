# =============================================================================
# Pull Request validation
# =============================================================================
# Self-hosted rather than the shared nodejs-build.yml, for a reason that cannot
# be worked around from the caller side:
#
# nodejs-build.yml contains a code-quality job, so calling it requires the
# caller to grant `pull-requests: write`. GitHub validates the permissions of
# every called workflow when the run is created — before any job `if:` is
# evaluated — so the requirement holds even though that job is disabled here.
# For Dependabot-triggered runs the GITHUB_TOKEN is read-only and that ceiling
# cannot be raised, so every Dependabot pull request ended in startup_failure
# with no job and no log. Since dependency bumps are most of the pull requests
# in this repo, they are the ones that most need validating.
#
# The same reasoning is why the sibling repositories validate pull requests
# inline as well. release.yml keeps the shared workflow: it runs on push, where
# the required permissions are available.
#
# The step sequence mirrors nodejs-build.yml so both gates stay comparable.
# =============================================================================

name: ✅ PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: 📚 Install dependencies
        run: npm ci

      - name: 💅 Format check
        run: npm run format:check

      - name: 🎨 Lint
        run: npm run lint

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Test
        # Coverage thresholds live in vitest.config.ts (80% across the board),
        # so the run itself is the gate.
        run: npm run test:coverage

      - name: 🏗️ Build
        run: npm run build

      - name: 🛡️ Audit
        # The app ships zero runtime dependencies, so only dev tooling could
        # ever flag here.
        run: npm audit --omit=dev --audit-level=high
