<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180">
  <!--
    Seamless film grain tile, used as a page-wide texture at very low opacity.
    `stitchTiles="stitch"` is what keeps the edges from showing when it repeats;
    the saturate matrix strips all colour so the grain adds material, never hue.
  -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <rect width="180" height="180" filter="url(#grain)" />
</svg>
